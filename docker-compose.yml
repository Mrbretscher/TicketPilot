services:
  api:
    build:
      context: .
    image: ticketpilot:local
    ports:
      - "8000:8000"
    environment:
      TICKETPILOT_ENV: docker-demo
      TICKETPILOT_PROJECT_ROOT: /app
    volumes:
      - ./artifacts/queue_baseline:/app/artifacts/queue_baseline:ro
      - ./artifacts/retrieval:/app/artifacts/retrieval:ro
      - ./reports:/app/reports:ro
      - review-data:/app/artifacts/review
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)); raise SystemExit(0 if data.get('ready') else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  streamlit:
    image: ticketpilot:local
    build:
      context: .
    command:
      [
        "python",
        "-m",
        "streamlit",
        "run",
        "src/ticketpilot/streamlit_app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501",
      ]
    ports:
      - "8501:8501"
    environment:
      TICKETPILOT_ENV: docker-demo
      TICKETPILOT_PROJECT_ROOT: /app
    volumes:
      - ./artifacts/queue_baseline:/app/artifacts/queue_baseline:ro
      - ./artifacts/retrieval:/app/artifacts/retrieval:ro
      - ./reports:/app/reports:ro
      - review-data:/app/artifacts/review
    depends_on:
      api:
        condition: service_healthy

volumes:
  review-data:
