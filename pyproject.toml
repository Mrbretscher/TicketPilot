[build-system]
requires = ["setuptools>=65.5", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ticketpilot"
version = "0.1.0"
description = "Human-reviewed IT support copilot portfolio project."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi",
    "numpy",
    "pandas",
    "scikit-learn",
    "sentence-transformers>=3,<4",
    "tensorflow>=2.16,<3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "pandas-stubs",
    "jupyterlab",
    "httpx",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--cov=ticketpilot --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests that require external services or network access",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["ticketpilot"]

[[tool.mypy.overrides]]
module = [
    "joblib.*",
    "keras.*",
    "sentence_transformers.*",
    "sklearn.*",
    "tensorflow.*",
]
ignore_missing_imports = true
