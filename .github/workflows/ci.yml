name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  checks:
    name: Python 3.11 checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project with development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install wheel
          python -m pip install --no-build-isolation -e ".[dev]"

      - name: Package import smoke test
        run: python -c "import ticketpilot; print(ticketpilot.__version__)"

      - name: FastAPI import smoke test
        run: python -c "import ticketpilot.api; print(ticketpilot.api.app.title)"

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Mypy
        run: python -m mypy src tests

      - name: Pytest
        run: python -m pytest

      - name: Repository verification script
        shell: pwsh
        run: ./scripts/verify.ps1

      - name: Docker build
        run: docker build -t ticketpilot:ci .

      - name: Docker import smoke test
        run: docker run --rm ticketpilot:ci python -c "import ticketpilot.api; print(ticketpilot.api.app.title)"
