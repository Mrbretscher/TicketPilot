  <rect x="1072" y="522" width="116" height="42" rx="6" fill="#eef2f8" stroke="#cbd5e2"/>
  <text x="1095" y="549" fill="#263445" font-family="Arial, Helvetica, sans-serif" font-size="14">Reroute</text>
  <text x="868" y="608" fill="#7a8494" font-family="Arial, Helvetica, sans-serif" font-size="13">Reviewer controls persist local SQLite records only.</text>
